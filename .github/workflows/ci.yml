name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            scheduler/requirements.txt
            backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scheduler/requirements.txt -r backend/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Compile Python sources
        run: python -m compileall -q scripts scheduler backend tests

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  docker:
    name: Docker checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose config
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build scheduler backend frontend

  smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      S3_UPLOAD_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start non-scraping services
        run: docker compose up -d --build postgres postgrest backend frontend

      - name: Verify database schema
        run: |
          docker compose exec -T postgres \
            psql -U postgres -d cda_busqueda \
            -c "select count(*) from public.desaparecidos;"

      - name: Verify PostgREST
        run: |
          for attempt in {1..60}; do
            if curl -fsS "http://localhost:3000/desaparecidos?limit=1" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgrest
          exit 1

      - name: Verify backend health
        run: |
          for attempt in {1..60}; do
            if curl -fsS "http://localhost:8000/healthz" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1

      - name: Verify frontend
        run: |
          for attempt in {1..60}; do
            if curl -fsS -I "http://localhost:3001" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs frontend
          exit 1

      - name: Stop services
        if: always()
        run: docker compose down -v
