services:
  postgres:
    image: postgres:18 #se sugiere usar 18 y no latest para que el codigo se mantenga mejor
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: cda_busqueda
      PGDATA: /var/lib/postgresql/data/18/docker
    volumes:
      - postgres_data:/var/lib/postgresql/data # Named volume for persistent data
      #tuve que modificar el volumen debido a que postgres 18 requiere otra dirección
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro # Mount the SQL script for initialization
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cda_busqueda"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  scrapper:
    profiles:
      - manual
    container_name: python_scrapper
    build:
      context: ./
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: us-east-1
    networks:
      - app-network
    # (opcional) si quieres mantener el contenedor siempre vivo para EXEC, puedes añadir:
    #restart: unless-stopped

  postgrest:
    image: postgrest/postgrest
    container_name: postgrest
    environment:
      PGRST_DB_URI: postgres://postgres:mysecretpassword@postgres:5432/cda_busqueda
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000" # Expose PostgREST on port 3000
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    container_name: nextjs_frontend
    build:
      context: . # Changed from ./frontend to .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    depends_on:
      postgrest:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  backend:
    container_name: fastapi_backend
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "8000:8000"
    #edittt - ELIMINADO: healthcheck ya no es necesario para el scheduler
    # healthcheck:
    #   test: ["CMD-SHELL", "wget -qO- http://localhost:8000/healthz > /dev/null"]
    #   interval: 60s
    #   timeout: 5s
    #   retries: 6
    #   start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      postgrest:
        condition: service_started
    networks:
      - app-network
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=us-east-1
      - PYTHONUNBUFFERED=1
    working_dir: /app
    volumes:
      - ./backend:/app #edittt - Solo backend, sin scripts
    restart: unless-stopped

  #edittt - Scheduler completamente rediseñado
  scheduler:
    build: 
      context: .
      dockerfile: ./scheduler/Dockerfile
    container_name: scheduler
    #edittt - CAMBIO CRÍTICO: Ahora depende de postgres directamente, no de backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      #edittt - ELIMINADO: Variables obsoletas del scheduler viejo
      # SCHEDULE_EVERY_SECONDS: "600"
      # BACKEND_TRIGGER_URL: "http://backend:8000/run-scrapers"
      # TRIGGER_TIMEOUT_SECONDS: "180"
      
      #edittt - NUEVO: Variables para los scrapers (conexión a BD)
      - PYTHONUNBUFFERED=1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=cda_busqueda
      - DB_USER=postgres
      - DB_PASSWORD=mysecretpassword
      - S3_UPLOAD_ENABLED=${S3_UPLOAD_ENABLED:-false}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-}
    volumes:
      #edittt - Montar todos los scripts disponibles (serial + paralelizado + utils)
      - ./scripts:/app/scripts:ro
      #edittt - Montar código del scheduler evita drift entre repo y contenedor
      - ./scheduler/config.yaml:/app/config.yaml:ro
      - ./scheduler/scheduler.py:/app/scheduler.py:ro
      - ./scheduler/scheduler_config.py:/app/scheduler_config.py:ro
      - ./scheduler/scraper_executor.py:/app/scraper_executor.py:ro
      - ./scheduler/jitter_calculator.py:/app/jitter_calculator.py:ro
      - ./scheduler/worker_pool.py:/app/worker_pool.py:ro
      - ./scheduler/pending_queue.py:/app/pending_queue.py:ro
      - ./scheduler/stats_tracker.py:/app/stats_tracker.py:ro
      - ./scheduler/shard_manager.py:/app/shard_manager.py:ro
    networks:
      - app-network
    restart: unless-stopped
    #edittt - NUEVO: Logging para debugging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: # Define named volume here
